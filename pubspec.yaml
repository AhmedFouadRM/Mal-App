name: masroofy
description: "Masroofy (مصروفي) — Personal expense tracker. Bilingual (AR/EN), offline-first."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI (Cubit by default; Bloc only where event transformers help)
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0

  # Navigation
  go_router: ^17.5.0

  # Local Database
  # Pinned to match drift_dev 2.34.0: drift 2.34.1+ breaks `drift_dev make-migrations`,
  # and newer drift_dev needs analyzer 13+, which freezed 3.x doesn't allow yet.
  drift: 2.34.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol

  # Data Classes & Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Error Handling
  fpdart: ^1.1.0

  # Pure-Dart annotations (@immutable) for domain value objects
  meta: ^1.18.0

  # Localization
  easy_localization: ^3.0.7
  intl: ^0.20.2

  # Auth & Security
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.0.0

  # Settings
  shared_preferences: ^2.5.2

  # Charts
  fl_chart: ^1.2.0

  # UI Utilities
  gap: ^3.0.1
  material_symbols_icons: ^4.2960.0
  flutter_animate: ^4.5.2
  # The Mal brand artwork (glyph, wordmark, slogans) as vector outlines
  flutter_svg: ^2.3.0

  # Export
  share_plus: ^13.3.0
  csv: ^8.0.0
  path_provider: ^2.1.5
  liquid_glass_widgets: ^1.11.0
  crypto: ^3.0.7
  file_picker: ^13.1.0
  package_info_plus: ^10.2.2

  # SMS Import (Android): local notifications and the SMS / notification runtime permissions
  flutter_local_notifications: ^22.3.1
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.15
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.9.4
  drift_dev: ^2.25.0

  # Linting
  very_good_analysis: ^10.3.0

  # Testing
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/brand/
    - assets/fonts/sora/OFL.txt
    # Thmanyah Sans is loaded at runtime when present (see ThmanyahFontLoader);
    # it is gitignored, and the app falls back to the system Arabic font.
    - assets/fonts/thmanyah/

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/sora/Sora-Regular.ttf
        - asset: assets/fonts/sora/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/sora/Sora-Bold.ttf
          weight: 700
